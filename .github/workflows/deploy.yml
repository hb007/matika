# Automatické nahrání na hosting přes FTP po každém pushi do main.
#
# Nastavení (jednou): GitHub → Settings → Secrets and variables → Actions
#   Secrets:   FTP_SERVER    např. ftp.tvuj-web.cz
#              FTP_USERNAME  FTP uživatel
#              FTP_PASSWORD  FTP heslo
#   Variables (nepovinné):
#              FTP_DIR       složka na serveru, končí lomítkem, např. www/matika/
#                            (výchozí ./ = kořen FTP účtu)
#              FTP_PROTOCOL  ftps (výchozí) nebo ftp, když hosting FTPS neumí
#
# Nahrávají se jen změněné soubory (stav si akce drží na serveru v souboru
# .ftp-deploy-sync-state.json). Pozor: složku, která z repa zmizí, akce na
# serveru maže celou včetně vyřazených souborů, a když tam složka už není,
# nasazení spadne (viz tasks/lessons.md). Databáze v data/ se nikdy
# nepřepisuje ani nemaže (vyřazená z nahrávání), složka data/ proto musí
# zůstat v repu. Před nahráním běží testy (tests/run.php).

name: Nasazení na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola syntaxe PHP
        run: |
          php -v | head -1
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Testy
        run: php tests/run.php

      - name: FTP není nastavené
        if: env.HAS_FTP != 'true'
        run: echo "::warning::Chybí secrets FTP_SERVER, FTP_USERNAME a FTP_PASSWORD (Settings → Secrets and variables → Actions). Nic se nenahrálo."

      - name: Nahrání na FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            docs/**
            tasks/**
            docker-compose*.yml
            tests/**
            data/*.sqlite*
